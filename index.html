<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CitasMed · Agenda tu cita médica</title>
  <meta name="theme-color" content="#F3F0E8">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Agenda, consulta, reprograma o cancela tus citas médicas en pocos pasos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido principal</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="CitasMed, ir al inicio">
        <svg class="brand-icon" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
          <circle cx="15" cy="15" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M15 8v14M8 15h14" stroke="#B8472A" stroke-width="3.2" stroke-linecap="square"/>
        </svg>
        <span>CitasMed</span>
      </a>
      <nav aria-label="Principal">
        <ul class="nav-list">
          <li><a href="#/" data-nav="home">Inicio</a></li>
          <li><a href="#/agendar/1" data-nav="agendar">Agendar cita</a></li>
          <li><a href="#/mis-citas" data-nav="mis-citas">Mis citas</a></li>
          <li><a href="#/ayuda" data-nav="ayuda">Ayuda</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Región viva: anuncia cambios de pantalla y resultados a lectores de pantalla -->
  <div id="status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <main id="main" class="container" tabindex="-1">
    <noscript><p class="banner banner-error">Esta aplicación necesita JavaScript activado para funcionar.</p></noscript>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="dlg-title" aria-describedby="dlg-text">
    <form method="dialog" class="dialog-body">
      <h2 id="dlg-title">¿Cancelar esta cita?</h2>
      <p id="dlg-text"></p>
      <div class="dialog-actions">
        <button type="submit" value="no" class="btn btn-secondary" id="dlg-keep">No, conservar mi cita</button>
        <button type="submit" value="yes" class="btn btn-danger" id="dlg-confirm">Sí, cancelar cita</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <div class="container">
      <p>Prototipo académico — Interacción Humano-Computadora. Tus datos se guardan solo en este navegador y no se envían a ningún servidor.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
